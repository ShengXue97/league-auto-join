<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010a13">
<title>League Remote</title>
<style>
  :root {
    --bg: #010a13; --panel: #0a1428; --gold: #c8aa6e; --gold-dim: #785a28;
    --text: #f0e6d2; --muted: #a09b8c; --blue: #0ac8b9; --red: #e84057; --green: #0acb6e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 20px 16px;
  }
  .wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 14px; letter-spacing: .2em; color: var(--gold); text-transform: uppercase; margin: 0; text-align: center; }
  .card { background: var(--panel); border: 1px solid var(--gold-dim); border-radius: 10px; padding: 18px; }
  .phase { font-size: 28px; font-weight: 700; text-align: center; }
  .sub { color: var(--muted); text-align: center; font-size: 15px; margin-top: 6px; min-height: 1.2em; }
  .big { font-size: 44px; font-variant-numeric: tabular-nums; text-align: center; font-weight: 700; }
  .btns { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
  button {
    font: inherit; font-weight: 700; letter-spacing: .08em; border-radius: 8px; border: 2px solid;
    padding: 22px 10px; font-size: 20px; cursor: pointer; color: var(--text); background: transparent;
  }
  button:disabled { opacity: .3; }
  #accept { border-color: var(--blue); background: #0ac8b922; }
  #decline { border-color: var(--red); background: #e8405718; font-size: 15px; }
  .ready #accept:not(:disabled) { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { background: #0ac8b966; } }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .toggle { width: 64px; height: 36px; border-radius: 18px; border: 2px solid var(--gold-dim); position: relative; padding: 0; background: #1e2328; flex: none; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--muted); transition: .15s; }
  .toggle.on { background: #0acb6e33; border-color: var(--green); }
  .toggle.on::after { left: 31px; background: var(--green); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .log { color: var(--muted); font-size: 13px; text-align: center; min-height: 1.2em; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 6px; vertical-align: middle; }
  .dot.ok { background: var(--green); }
  [hidden] { display: none !important; }

  /* champion select */
  .turn { text-align: center; font-weight: 700; font-size: 18px; padding: 12px; border-radius: 8px; background: #1e2328; }
  .turn.now { background: #0ac8b933; border: 2px solid var(--blue); animation: pulse 1s infinite; }
  .turn.ban.now { background: #e8405733; border-color: var(--red); }
  .label { color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 8px; }
  .team { display: flex; flex-direction: column; gap: 6px; }
  .player { display: flex; align-items: center; gap: 10px; font-size: 15px; }
  .player.me { color: var(--gold); font-weight: 700; }
  .player .st { margin-left: auto; color: var(--muted); font-size: 13px; }
  .player .st.locked { color: var(--green); }
  .icon { width: 36px; height: 36px; border-radius: 4px; background: #1e2328; object-fit: cover; flex: none; }
  .icons { display: flex; flex-wrap: wrap; gap: 6px; }
  .icons .icon { width: 30px; height: 30px; }
  .icons .ban { filter: grayscale(1); opacity: .7; }
  input[type=search] {
    width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 8px;
    border: 1px solid var(--gold-dim); background: #010a13; color: var(--text);
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; margin-top: 12px; max-height: 46vh; overflow-y: auto; }
  .champ { border: 2px solid transparent; border-radius: 6px; padding: 2px; background: none; text-align: center; font-size: 11px; font-weight: 400; letter-spacing: 0; color: var(--text); }
  .champ img { width: 100%; aspect-ratio: 1; border-radius: 4px; display: block; background: #1e2328; }
  .champ span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .champ.sel { border-color: var(--gold); }
  .champ.fav span::before { content: "★ "; color: var(--gold); }
  #lock { width: 100%; border-color: var(--blue); background: #0ac8b922; }
  #lock.ban { border-color: var(--red); background: #e8405722; }
  .empty { color: var(--muted); text-align: center; grid-column: 1 / -1; padding: 12px; }

  /* pick order + swaps */
  .ord { flex: none; width: 26px; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); }
  .player.me .ord { color: var(--gold); }
  .small { padding: 8px 10px; font-size: 13px; letter-spacing: .04em; border-width: 1px; border-color: var(--gold-dim); border-radius: 6px; }
  .small.go { border-color: var(--blue); background: #0ac8b922; }
  .small.best { border-color: var(--gold); background: #c8aa6e33; }
  .small.no { border-color: var(--red); }
  .swapcard { border-color: var(--blue); }
  .swapcard.worse { border-color: var(--red); }
  .swapcard .btns { margin-top: 12px; }
  .swapcard button { padding: 14px 8px; font-size: 16px; }
  #swapUp { width: 100%; margin-top: 12px; }

  /* my champions */
  .favs { display: flex; flex-wrap: wrap; gap: 8px; }
  .fav-chip { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 8px;
    border: 1px solid var(--gold-dim); background: #1e2328; font-size: 14px; font-weight: 400; letter-spacing: 0; text-align: left; }
  .fav-chip .icon { width: 32px; height: 32px; }
  .fav-chip small { display: block; color: var(--muted); font-size: 11px; }
  .fav-chip.available { border-color: var(--green); }
  .fav-chip.available small { color: var(--green); }
  .fav-chip.mine { border-color: var(--gold); }
  .fav-chip.mine small { color: var(--gold); }
  .fav-chip.banned, .fav-chip.ally, .fav-chip.enemy, .fav-chip.unavailable { opacity: .45; }
  .fav-chip.ally_hover small { color: #f0b232; }
  #star { width: 100%; margin-top: 10px; }
  .favlist { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .favrow { display: flex; align-items: center; gap: 8px; }
  .favrow .n { color: var(--muted); width: 20px; }
  .favrow .grow { flex: 1; }
  .addrow { display: flex; gap: 8px; margin-top: 10px; }
  .addrow input { flex: 1; font: inherit; font-size: 16px; padding: 10px; border-radius: 6px;
    border: 1px solid var(--gold-dim); background: #010a13; color: var(--text); min-width: 0; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <h1>League Remote</h1>

  <div class="card">
    <div class="phase" id="phase">Connecting…</div>
    <div class="big" id="clock"></div>
    <div class="sub" id="sub"></div>
  </div>

  <div class="btns" id="queueBtns">
    <button id="accept" disabled>ACCEPT</button>
    <button id="decline" disabled>DECLINE</button>
  </div>

  <section id="cs" hidden>
    <div class="wrap">
      <div class="turn" id="turn"></div>

      <div class="card swapcard" id="swapIn" hidden>
        <div id="swapInText"></div>
        <div class="btns">
          <button id="swapAccept">ACCEPT</button>
          <button id="swapDecline">DECLINE</button>
        </div>
      </div>

      <div class="card" id="myChamps" hidden>
        <div class="label">My champions</div>
        <div class="favs" id="favs"></div>
      </div>

      <div class="card">
        <div class="label">Your team · pick order</div>
        <div class="team" id="team"></div>
        <button class="small best" id="swapUp" hidden></button>
        <div id="bansBox" hidden>
          <div class="label" style="margin-top:14px">Bans</div>
          <div class="icons" id="bans"></div>
        </div>
        <div id="enemyBox" hidden>
          <div class="label" style="margin-top:14px">Enemy picks</div>
          <div class="icons" id="enemies"></div>
        </div>
      </div>

      <div class="card" id="pickerCard">
        <input type="search" id="search" placeholder="Search champion…" autocomplete="off">
        <div class="grid" id="grid"></div>
        <button class="small" id="star" hidden></button>
      </div>

      <button id="lock" disabled>CHOOSE A CHAMPION</button>
    </div>
  </section>

  <div class="card">
    <div class="row">
      <div>
        <div><b>Auto-accept</b></div>
        <div class="hint">Accept instantly and just notify me</div>
      </div>
      <button class="toggle" id="auto" aria-label="Toggle auto-accept"></button>
    </div>
  </div>

  <div class="card">
    <div><b>My champions</b></div>
    <div class="hint">Your picks in priority order. Shown first in champ select, and as one-tap buttons in alerts.</div>
    <div class="favlist" id="favlist"></div>
    <div class="addrow">
      <input id="favAdd" list="champNames" placeholder="Add champion…" autocomplete="off">
      <button class="small go" id="favAddBtn">ADD</button>
    </div>
    <datalist id="champNames"></datalist>
  </div>

  <div class="log"><span class="dot" id="dot"></span><span id="log"></span></div>
  <div class="log" id="version"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const mmss = s => s == null ? "" : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const NAMES = {
  None: "Idle", Lobby: "In Lobby", Matchmaking: "In Queue", ReadyCheck: "MATCH FOUND!",
  ChampSelect: "Champ Select", InProgress: "In Game", GameStart: "Loading Game",
  WaitingForStats: "Post Game", PreEndOfGame: "Post Game", EndOfGame: "Post Game",
  Reconnect: "Reconnect Needed",
};
const CS_PHASES = { PLANNING: "Declare your pick", BAN_PICK: "Bans & picks", FINALIZATION: "Final phase" };

let champs = {};          // id -> name
let favorites = { pick: [], ban: [] }; // champion names from config, priority order
let selected = 0;         // champion chosen on this page
let selectedFor = null;   // action id the selection belongs to
let lastGridKey = "";
let lastCs = null;

const icon = (id, cls = "icon") => id ? `<img class="${cls}" loading="lazy" src="/icon/${id}" alt="">` : `<span class="${cls}"></span>`;
const champName = id => champs[id] || (id ? `#${id}` : "");

async function loadChamps() {
  try {
    const r = await fetch("/api/champs", { cache: "no-store" });
    if (r.ok) for (const c of await r.json()) champs[c.id] = c.name;
    $("champNames").innerHTML = [...new Set(Object.values(champs))].sort()
      .map(n => `<option value="${n}">`).join("");
  } catch (e) { /* retried on next champ select render */ }
}

const favIndex = (name, kind) => {
  const i = favorites[kind].findIndex(n => n.toLowerCase() === name.toLowerCase());
  return i < 0 ? 999 : i;
};
const FAV_STATUS = {
  available: "Available", mine: "Your pick", banned: "Banned", ally: "Taken by {by}",
  ally_hover: "{by} is hovering", enemy: "Enemy picked", unavailable: "Not available",
};

function renderChampSelect(cs) {
  lastCs = cs;
  const act = cs.action;
  const isBan = act && act.type === "ban";
  if (!Object.keys(champs).length) loadChamps();

  // banner
  const turn = $("turn");
  turn.className = "turn" + (isBan ? " ban" : "") + (act && act.in_progress ? " now" : "");
  turn.textContent = act && act.in_progress ? `YOUR TURN TO ${isBan ? "BAN" : "PICK"}!`
    : act ? `Your ${isBan ? "ban" : "pick"} is coming up`
    : cs.done ? "✔ You're locked in" : "Waiting for others…";

  // incoming swap request
  const sin = cs.swap_in;
  $("swapIn").hidden = !sin;
  if (sin) {
    const better = sin.their_order < sin.my_order;
    $("swapIn").classList.toggle("worse", !better);
    $("swapInText").innerHTML = `<b>${sin.name}</b> wants to swap pick order.<br>
      You'd pick <b>#${sin.their_order}</b> instead of #${sin.my_order} —
      ${better ? "✅ earlier, recommended" : "⚠ later"}`;
    $("swapAccept").dataset.id = $("swapDecline").dataset.id = sin.id;
  }

  // my champions
  const favs = cs.favorites || [];
  $("myChamps").hidden = !favs.length || !cs.pick_action;
  $("favs").innerHTML = favs.map(f => `
    <button class="fav-chip ${f.status}" data-id="${f.id}" ${f.status === "available" ? "" : "disabled"}>
      ${icon(f.id)}<span>${f.name}<small>${FAV_STATUS[f.status].replace("{by}", f.by)}</small></span>
    </button>`).join("");

  // team in pick order, with swap buttons for earlier picks
  const up = cs.swap_up;
  const canSwap = cs.pick_action && !cs.swap_out;
  $("team").innerHTML = cs.team.map(p => {
    let right = `<div class="st${p.locked ? " locked" : ""}">${p.locked ? "Locked" : p.champ ? "Hovering" : ""}</div>`;
    if (!p.me && p.swap_state === "SENT") {
      right = `<button class="small no" data-cancel="${p.swap_id}">Waiting… ✕</button>`;
    } else if (!p.me && canSwap && !p.locked && p.swap_state === "AVAILABLE" && p.order < cs.my_order) {
      right = `<button class="small ${up && up.cell === p.cell ? "best" : "go"}" data-swap="${p.swap_id}">⇅ Swap</button>`;
    }
    return `
    <div class="player${p.me ? " me" : ""}">
      <div class="ord">${p.order ? "#" + p.order : ""}</div>
      ${icon(p.champ)}
      <div>${p.me ? "You" : (p.name || "Ally")}${p.pos ? ` · ${p.pos}` : ""}<br>
        <small>${champName(p.champ) || "—"}</small></div>
      <div style="margin-left:auto">${right}</div>
    </div>`;
  }).join("");
  $("swapUp").hidden = !up;
  if (up) $("swapUp").textContent = `⇅ Ask ${up.name} for pick #${up.order}`;
  $("bansBox").hidden = !cs.bans.length;
  $("bans").innerHTML = cs.bans.map(id => icon(id, "icon ban")).join("");
  const enemies = cs.enemies.filter(Boolean);
  $("enemyBox").hidden = !enemies.length;
  $("enemies").innerHTML = enemies.map(id => icon(id)).join("");

  // picker
  $("pickerCard").hidden = !act;
  // new action (e.g. ban finished, now picking) -> fresh selection
  if (act && act.id !== selectedFor) { selected = 0; selectedFor = act.id; }
  // start from what's hovered in the client, else your top available favorite
  const meP = cs.team.find(p => p.me);
  if (act && !selected) {
    const topFav = act.type === "pick"
      ? (favs.find(f => f.status === "available") || {}).id
      : cs.choices.slice().sort((a, b) => favIndex(champName(a), "ban") - favIndex(champName(b), "ban"))
          .find(id => favIndex(champName(id), "ban") < 999);
    selected = act.champ || (act.type === "pick" && meP && !meP.locked && meP.champ) || topFav || 0;
  }
  renderGrid(cs);

  const kind = isBan ? "ban" : "pick";
  const star = $("star");
  star.hidden = !act || !selected;
  if (selected) {
    const isFav = favIndex(champName(selected), kind) < 999;
    star.textContent = isFav ? `★ Remove ${champName(selected)} from my ${kind}s` : `☆ Add ${champName(selected)} to my ${kind}s`;
    star.dataset.op = isFav ? "remove" : "add";
    star.dataset.kind = kind;
  }

  const lock = $("lock");
  lock.hidden = !act;
  lock.className = isBan ? "ban" : "";
  const ok = act && act.in_progress && selected && cs.choices.includes(selected);
  lock.disabled = !ok;
  lock.textContent = !selected ? "CHOOSE A CHAMPION"
    : !act || !act.in_progress ? `${champName(selected)} (wait for your turn)`
    : `${isBan ? "BAN" : "LOCK IN"} ${champName(selected).toUpperCase()}`;
}

function renderGrid(cs) {
  const q = $("search").value.trim().toLowerCase();
  const kind = cs.action && cs.action.type === "ban" ? "ban" : "pick";
  const key = [cs.choices.join(","), q, selected, Object.keys(champs).length, favorites[kind].join(",")].join("|");
  if (key === lastGridKey) return; // keep scroll position between polls
  lastGridKey = key;

  const list = cs.choices
    .map(id => ({ id, name: champName(id) }))
    .filter(c => !q || c.name.toLowerCase().includes(q))
    .sort((a, b) => (favIndex(a.name, kind) - favIndex(b.name, kind)) || a.name.localeCompare(b.name));
  $("grid").innerHTML = list.length ? list.map(c => `
    <button class="champ${c.id === selected ? " sel" : ""}${favIndex(c.name, kind) < 999 ? " fav" : ""}" data-id="${c.id}">
      ${icon(c.id, "")}<span>${c.name}</span>
    </button>`).join("") : `<div class="empty">No champions match</div>`;
}

$("grid").onclick = e => {
  const b = e.target.closest(".champ");
  if (!b) return;
  selected = +b.dataset.id;
  if (lastCs) renderChampSelect(lastCs);
  call("POST", `/api/cs/hover?champ=${selected}`); // shows your choice to teammates
};
$("search").oninput = () => lastCs && renderGrid(lastCs);
$("favs").onclick = e => {
  const b = e.target.closest(".fav-chip");
  if (!b || b.disabled) return;
  selected = +b.dataset.id;
  if (lastCs) renderChampSelect(lastCs);
  call("POST", `/api/cs/hover?kind=pick&champ=${selected}`);
};
$("team").onclick = e => {
  const s = e.target.closest("[data-swap]"), c = e.target.closest("[data-cancel]");
  if (s) call("POST", `/api/cs/swap?op=request&id=${s.dataset.swap}`);
  if (c) call("POST", `/api/cs/swap?op=cancel&id=${c.dataset.cancel}`);
};
$("swapUp").onclick = () => call("POST", "/api/cs/swap-up");
$("swapAccept").onclick = e => call("POST", `/api/cs/swap?op=accept&id=${e.target.dataset.id}`);
$("swapDecline").onclick = e => call("POST", `/api/cs/swap?op=decline&id=${e.target.dataset.id}`);
$("star").onclick = e => {
  const d = e.target.dataset;
  call("POST", `/api/favorites?op=${d.op}&kind=${d.kind}&name=${encodeURIComponent(champName(selected))}`);
};

function renderFavList() {
  const list = favorites.pick;
  const key = list.join(",");
  if ($("favlist").dataset.key === key) return;
  $("favlist").dataset.key = key;
  $("favlist").innerHTML = list.length ? list.map((n, i) => `
    <div class="favrow">
      <span class="n">${i + 1}.</span><span class="grow">${n}</span>
      ${i ? `<button class="small" data-up="${n}">↑</button>` : ""}
      <button class="small no" data-rm="${n}">✕</button>
    </div>`).join("") : `<div class="hint">None yet — add your mains below.</div>`;
}
$("favlist").onclick = e => {
  const u = e.target.closest("[data-up]"), r = e.target.closest("[data-rm]");
  if (u) call("POST", `/api/favorites?op=up&kind=pick&name=${encodeURIComponent(u.dataset.up)}`);
  if (r) call("POST", `/api/favorites?op=remove&kind=pick&name=${encodeURIComponent(r.dataset.rm)}`);
};
$("favAddBtn").onclick = () => {
  const n = $("favAdd").value.trim();
  if (!n) return;
  $("favAdd").value = "";
  call("POST", `/api/favorites?op=add&kind=pick&name=${encodeURIComponent(n)}`);
};
$("lock").onclick = () => call("POST", `/api/cs/lock?champ=${selected}`);

function render(s) {
  $("dot").classList.toggle("ok", !!s.connected);
  $("phase").textContent = s.connected ? (NAMES[s.phase] || s.phase) : "Client not running";
  $("auto").classList.toggle("on", !!s.auto_accept);
  $("log").textContent = s.last_event || "";
  if (s.version) $("version").textContent = `v${s.version}`;
  if (s.favorites) { favorites = s.favorites; renderFavList(); }

  let clock = "", sub = "";
  if (s.phase === "Matchmaking") {
    clock = mmss(s.time_in_queue);
    sub = s.estimated ? `Estimated: ${mmss(s.estimated)}` : "";
  } else if (s.phase === "ReadyCheck") {
    clock = s.ready_timer != null ? Math.max(0, Math.ceil(10 - s.ready_timer)) + "s" : "";
    sub = s.my_response === "Accepted" ? "✔ You accepted — waiting for others"
        : s.my_response === "Declined" ? "✖ You declined" : "Tap ACCEPT now!";
  } else if (s.phase === "ChampSelect") {
    clock = s.cs_time_left != null ? s.cs_time_left + "s" : "";
    sub = CS_PHASES[s.cs_phase] || s.cs_phase || "";
  }
  $("clock").textContent = clock;
  $("sub").textContent = sub;

  const inCs = s.phase === "ChampSelect" && s.cs;
  $("cs").hidden = !inCs;
  $("queueBtns").hidden = !["Matchmaking", "ReadyCheck"].includes(s.phase);
  if (inCs) renderChampSelect(s.cs);
  else { selected = 0; selectedFor = null; lastCs = null; lastGridKey = ""; }

  const canAnswer = s.phase === "ReadyCheck" && s.my_response === "None";
  $("accept").disabled = $("decline").disabled = !canAnswer;
  $("app").classList.toggle("ready", s.phase === "ReadyCheck");
  document.title = s.phase === "ReadyCheck" ? "⚠ MATCH FOUND"
    : inCs && s.cs.action && s.cs.action.in_progress ? "⚠ YOUR TURN" : "League Remote";
}

async function call(method, path) {
  try {
    const r = await fetch(path, { method, cache: "no-store" });
    const data = await r.json();
    if (!r.ok) { $("log").textContent = data.error || `Error ${r.status}`; return; }
    render(data);
  } catch (e) {
    $("dot").classList.remove("ok");
    $("log").textContent = "Can't reach PC — same Wi-Fi?";
  }
}

$("accept").onclick = () => call("POST", "/api/accept");
$("decline").onclick = () => call("POST", "/api/decline");
$("auto").onclick = () => call("POST", "/api/auto");

loadChamps();
call("GET", "/api/status");
setInterval(() => call("GET", "/api/status"), 1000);
</script>
</body>
</html>

# Pushing a version tag (v1.2.3) builds the installer on GitHub and publishes the
# release as github-actions[bot], so no personal account appears on the release.
# "Run workflow" with an older tag republishes that version (not marked latest).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to republish, e.g. v2.2.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  LATEST: ${{ github.event_name == 'push' }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the version to build
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check out the release tools (current CHANGELOG and notes script)
        uses: actions/checkout@v4
        with:
          ref: main
          path: ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6"
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $v = (Select-String -Path league_remote.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG doesn't match __version__ $v" }

      - name: Test
        if: github.event_name == 'push'  # republished versions were tested when first released
        shell: pwsh
        run: |
          Get-ChildItem tests\test_*.py | ForEach-Object {
            python $_.FullName
            if ($LASTEXITCODE) { throw "$($_.Name) failed" }
          }

      - name: Build
        run: python build.py

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:TAG.TrimStart("v")
          python ci/tools/release_notes.py $v | Out-File -Encoding utf8 notes.md
          if ($LASTEXITCODE) { throw "No release notes for $v" }
          gh release create $env:TAG "dist/LeagueRemote-Setup-$v.exe" --repo $env:GITHUB_REPOSITORY `
            --verify-tag --title "League Remote $v" --notes-file notes.md --latest=$env:LATEST
